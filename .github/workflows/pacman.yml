name: Generate Pacman

on:
  # refresh every 24 hours
  schedule:
    - cron: "0 0 * * *"
  # lets you press "Run workflow" manually in the Actions tab
  workflow_dispatch:
  # also runs when you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man contribution game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # The game ships in green/yellow/red. This step repaints it into
      # navy, neon blue and ash white so it matches the profile.
      - name: Recolor to navy and ash white
        run: |
          python3 - <<'PY'
          import re

          MAP = {
              "#161b22": "#16224A",  # empty cells
              "#0e4429": "#26358F",  # few contributions
              "#006d32": "#3D5AFE",
              "#26a641": "#7C98FF",
              "#39d353": "#A6B8FF",  # most contributions
              "#8b949e": "#A6B8FF",  # month labels
              "#ffffff": "#E9E9E9",
              "#0d1117": "#0A1128",  # background
          }
          # tints the ghost sprites blue-white
          FILTER = ('<defs><filter id="navytint" color-interpolation-filters="sRGB">'
                    '<feColorMatrix type="matrix" values="0.231 0.454 0.085 0 0  '
                    '0.294 0.578 0.108 0 0  0.42 0.826 0.154 0 0  0 0 0 1 0"/>'
                    '</filter></defs>')

          s = open("dist/pacman-contribution-graph-dark.svg", encoding="utf-8").read()
          for a, b in MAP.items():
              s = re.sub(re.escape(a), b, s, flags=re.I)
          s = re.sub(r'fill="(yellow|red)"',
                     lambda m: 'fill="#E9E9E9"' if m.group(1) == "yellow" else 'fill="#7C98FF"', s)

          def fixvals(m):
              v = re.sub(r'\byellow\b', '#E9E9E9', m.group(0))
              return re.sub(r'\bred\b', '#7C98FF', v)

          s = re.sub(r'values="[^"]*"', fixvals, s)
          s = re.sub(r'(<svg[^>]*>)', lambda m: m.group(1) + FILTER, s, count=1)
          s = s.replace('<image ', '<image filter="url(#navytint)" ')
          open("dist/pacman-navy.svg", "w", encoding="utf-8").write(s)
          PY

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
